# .github/workflows/team-db.yml
name: Team DB

on:
  pull_request:
  push:
    branches: [master]

jobs:
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db supabase/tests/team_permissions.test.sql
