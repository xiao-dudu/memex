name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

      - name: Build
        env:
          MEMEX_SUPABASE_URL: ${{ secrets.MEMEX_SUPABASE_URL }}
          MEMEX_SUPABASE_ANON_KEY: ${{ secrets.MEMEX_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @memex/app exec electron-builder --win nsis --publish never

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-output
          path: release/**
          if-no-files-found: warn

      - name: Build changelog
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            RANGE="$TAG"
            COMPARE=""
          else
            RANGE="${PREV}..${TAG}"
            COMPARE="完整变更：https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            git log "$RANGE" --no-merges --pretty=format:'%s' \
              | grep -vE '^chore\(release\):' \
              | sed -E 's/^[a-z]+(\([^)]*\))?: //' \
              | sed -E 's/^/- /' || true
            echo ""
            echo ""
            echo "$COMPARE"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Memex ${{ github.event.inputs.tag || github.ref_name }}
          # 应用内的更新弹窗展示的是 release body，正文由上一步从提交生成
          body: ${{ steps.changelog.outputs.body }}
          fail_on_unmatched_files: true
          files: |
            release/Memex-Setup-*.exe
            release/Memex-Setup-*.exe.blockmap
            release/latest.yml
